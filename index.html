<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprende Conmigo</title>
<!-- Home Screen / installed-app details (used when served as a website, e.g. GitHub Pages) -->
<meta name="theme-color" content="#FBF3E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aprende">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<!--HOST-BOOTSTRAP-->
</head>
<body>
<div class="wrap">
  <div id="login" hidden></div>
  <div id="panel" hidden></div>
  <div id="main" hidden>
  <header>
    <div class="topbar">
      <div class="eyebrow">Aprende Conmigo</div>
      <div class="topbar-right">
        <button class="search-btn" id="searchBtn" aria-label="Search phrases" title="Search phrases">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        </button>
        <div class="profile-slot" id="profileChip"></div>
      </div>
    </div>
    <h1 id="appTitle">Real Mexican Spanish</h1>
    <div id="greeting"></div>
  </header>

  <div class="decks" id="decks"></div>
  <div class="level-chips" id="levelChips"></div>

  <div class="modes">
    <button class="mode-btn active" data-mode="flash" id="modeFlash">Flashcards</button>
    <button class="mode-btn" data-mode="quiz" id="modeQuiz">Quiz</button>
    <button class="mode-btn" data-mode="talk" id="modeTalk">Conversations</button>
  </div>
  <div id="difficulty"></div>
  <div id="quizOptions"></div>

  <div id="reviewBanner"></div>
  <div class="stage" id="stage"></div>
  <div id="challenges"></div>
  <div class="streak" id="streak"></div>

  <div class="sync">
    <div class="sync-row">
      <button class="sync-btn" id="exportBtn">Export progress</button>
      <button class="sync-btn" id="importBtn">Import progress</button>
    </div>
    <div id="syncPanel"></div>
  </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script src="conversations.js"></script>
<script src="storage.js"></script>
<script src="srs.js"></script>
<script src="challenges.js"></script>
<script src="profiles.js"></script>
<script src="voice.js"></script>
<script src="quiz.js"></script>
<script src="app.js"></script>
</body>
</html>
